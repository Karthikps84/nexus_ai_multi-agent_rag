name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local_lama_rag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      # Tests run with no API keys: nothing here may call NVIDIA/Serper.
      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local_lama_rag/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local_lama_rag/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            Feat
            fix
            Fix
            docs
            Docs
            style
            Style
            refactor
            Refactor
            perf
            Perf
            test
            Test
            build
            Build
            ci
            Ci
            chore
            Chore
            revert
            Revert
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?[:/]\s(.*)$'
          headerPatternCorrespondence: type, scope, subject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
