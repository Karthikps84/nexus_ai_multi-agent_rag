# Run the whole app:  docker compose up --build
#   web  -> http://localhost:3000
#   api  -> http://localhost:8000   (put NVIDIA_API_KEY in .env first)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
      USERS_ROOT: /app/users
    ports:
      - "8000:8000"
    volumes:
      - nexus-users:/app/users # accounts, documents and indexes survive restarts

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  nexus-users:
